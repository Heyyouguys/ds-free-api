# cargo-deny 配置 —— 许可证 / 依赖禁用 / 来源校验
#
# 与 .cargo/audit.toml 分工：
# - cargo-audit       → RUSTSEC 漏洞库（含 yanked / unsound 告警）
# - cargo-deny        → 许可证白名单、重复版本、禁用 crate、registry 来源
#
# 用法：cargo deny --all-features check licenses bans sources

[graph]
all-features = true

[advisories]
version = 2
# 漏洞库检查交给 cargo-audit（.cargo/audit.toml 中已记录豁免原因），
# 这里只保留 cargo-deny 独有的许可证/来源能力，避免同一问题两处维护。
ignore = [
    # 见 .cargo/audit.toml：wasmtime 供应链告警，攻击面不可达
    "RUSTSEC-2026-0002",
    # 见 .cargo/audit.toml：wreq 5.3.0 传递引入的 lru unsound，上游 yank 无法升级
    "RUSTSEC-2026-0253",
]

[licenses]
version = 2
# 允许的许可证：本项目 GPL-3.0，依赖需与之兼容
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-only",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# 禁止在依赖中使用 git 源（CI 无法复现）与通配符版本
deny = [
    # openssl 与 BoringSSL 并存会引入第二套 TLS 实现，本项目统一走 BoringSSL
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
